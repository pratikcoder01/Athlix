services:
  - type: web
    name: athlix-cv-service
    runtime: docker
    dockerfilePath: ./cv-service/Dockerfile
    dockerContext: ./cv-service
    autoDeployTrigger: off
    numInstances: 1
    plan: 1c-2g
    healthCheckPath: /ready
    disk:
      name: cv-job-state
      mountPath: /var/lib/athlix-cv
      sizeGB: 1
    envVars:
      - key: CV_SERVICE_API_KEY
        sync: false
      - key: CV_MODEL_PATH
        sync: false
      - key: CV_STATE_DIR
        value: /var/lib/athlix-cv
      - key: CV_TEMP_DIR
        value: /tmp/athlix-cv
