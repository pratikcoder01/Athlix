name: ATHLIX checks

on:
  push:
    branches: [main, develop, 'codex/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked workspace dependencies
        run: npm ci --legacy-peer-deps
      - name: Client lint
        run: npm run lint
      - name: Client and server type checks
        run: npm run typecheck
      - name: Start isolated MongoDB replica set for transaction tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm --name athlix-ci-mongo -p 127.0.0.1:27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          ready=0
          for attempt in {1..30}; do
            if docker exec athlix-ci-mongo mongosh --quiet --eval 'if (!db.adminCommand({ping:1}).ok) quit(1)' > /dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          docker exec athlix-ci-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          primary=0
          for attempt in {1..30}; do
            if docker exec athlix-ci-mongo mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)' > /dev/null 2>&1; then
              primary=1
              break
            fi
            sleep 1
          done
          test "$primary" = 1
      - name: Client and server regression tests
        run: npm run test
        env:
          TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
      - name: Build client and server
        run: npm run build
      - name: Install browser for isolated UI smoke tests
        id: install_browser
        run: npx playwright install --with-deps chromium
      - name: Exercise browser request wiring and responsive layouts
        shell: bash
        run: |
          set -euo pipefail
          npm run start --workspace client -- --hostname 127.0.0.1 --port 3100 > /tmp/athlix-next.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          node -e 'const deadline=Date.now()+60000; (async()=>{while(Date.now()<deadline){try{const r=await fetch("http://127.0.0.1:3100");if(r.ok)return;}catch{}await new Promise(r=>setTimeout(r,500));}throw Error("Built client did not become ready");})().catch(e=>{console.error(e.message);process.exit(1)})'
          node client/test/e2e-smoke.cjs
          node client/test/booking-e2e.cjs
          node client/test/workspace-e2e.cjs
        env:
          ATHLIX_E2E_BASE_URL: http://127.0.0.1:3100
      - name: Development hydration diagnostics
        if: always() && !cancelled() && steps.install_browser.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          npm run dev --workspace client -- --hostname 127.0.0.1 --port 3101 > /tmp/athlix-next-dev.log 2>&1 &
          dev_pid=$!
          trap 'kill "$dev_pid" 2>/dev/null || true' EXIT
          node -e 'const deadline=Date.now()+60000; (async()=>{while(Date.now()<deadline){try{const r=await fetch("http://127.0.0.1:3101");if(r.ok)return;}catch{}await new Promise(r=>setTimeout(r,500));}throw Error("Development client did not become ready");})().catch(e=>{console.error(e.message);process.exit(1)})'
          ATHLIX_E2E_BASE_URL=http://127.0.0.1:3101 node client/test/hydration-debug.cjs
      - name: Audit dependencies (high and critical block the check)
        run: npm audit --audit-level=high --json > npm-audit.json
      - name: Retain dependency audit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-audit
          path: npm-audit.json
          if-no-files-found: ignore
      - name: Stop disposable MongoDB
        if: always()
        run: docker stop athlix-ci-mongo || true

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cv-service
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            cv-service/requirements.txt
            cv-service/constraints.txt
      - name: Install OpenCV runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Install constrained Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check Python syntax
        run: python -m compileall -q main.py video_safety.py cv ai
      - name: Python service and scoring regressions
        run: python -m unittest discover -s tests -v
